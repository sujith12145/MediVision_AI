services:
  # ── FastAPI Backend Service ────────────────────────────────────────────────
  - type: web
    name: medivision-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: SUPABASE_STORAGE_BUCKET
        value: medicine-images
      - key: VISION_MODEL
        value: gemini-2.5-flash
      - key: NLTK_DISABLE_IMPORT_SECURITY
        value: "1"
      - key: DATABASE_URL
        sync: false # User must configure in Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: VISION_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false # Should contain local origins + the frontend production URL

  # ── React Frontend Service ─────────────────────────────────────────────────
  - type: web
    name: medivision-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
